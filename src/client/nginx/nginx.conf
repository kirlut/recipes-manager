server {
    listen 80;
    server_name _;

    # Frontend statics (Vite build output).
    root /usr/share/nginx/html;
    index index.html;

    # Reasonable limits; image upload max is 5 MB but the backend enforces it.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: forward to backend, stripping the /api/ prefix via trailing slash.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded images served directly from the shared volume.
    # Missing files yield nginx's stock text/html 404.
    location /uploads/ {
        alias /uploads/;
        access_log off;
    }

    # SPA fallback for the frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
