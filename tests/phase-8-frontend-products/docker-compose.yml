name: recipes-manager-test-phase-8-frontend-products

# Production-shaped stack for the frontend phase: postgres + backend +
# nginx (with the built frontend baked in). Per `testing_strategy.md`
# §4 §6, frontend phases hit `http://127.0.0.1:8080` and the backend
# is NOT host-bound (matches production). Postgres remains host-bound
# so `truncate_all()` and `pg_conn` can introspect it from pytest.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: recipes_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d recipes_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data

  backend:
    build: ../../src/server
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: recipes_test
      JWT_SECRET: test-secret-do-not-use-in-prod
      IMAGE_DIR: /uploads
      SEARCH_SIMILARITY_THRESHOLD: "0.3"
      LOG_LEVEL: INFO
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - test_uploads:/uploads

  nginx:
    build: ../../src/client
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - test_uploads:/uploads:ro

volumes:
  test_pgdata:
  test_uploads:
