name: recipes-manager-test-phase-9-frontend-recipes-and-shopping

# Production-shaped stack for phase-9 (frontend recipes + shopping
# list UI). Mirrors `tests/phase-8-frontend-products/docker-compose.yml`
# per `testing_strategy.md` §4 §6: nginx is host-bound on 8080
# (default; override with HOST_PORT), backend stays in-network only,
# postgres is host-bound on 15432 so `truncate_all()` and `pg_conn`
# can introspect it from pytest.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: recipes_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d recipes_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data

  backend:
    build: ../../src/server
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: recipes_test
      JWT_SECRET: test-secret-do-not-use-in-prod
      IMAGE_DIR: /uploads
      SEARCH_SIMILARITY_THRESHOLD: "0.3"
      LOG_LEVEL: INFO
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - test_uploads:/uploads

  nginx:
    build: ../../src/client
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - test_uploads:/uploads:ro

volumes:
  test_pgdata:
  test_uploads:
